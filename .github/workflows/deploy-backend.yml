name: 🚀 Deploy Laravel Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, mysql, zip
          coverage: none

      - name: Install Composer Dependencies
        run: |
          cd backend
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Deploy via tar+ssh
        env:
          SSH_KEY: ${{ secrets.SSH_KEY_PRIVATE }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: 2223
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p $SSH_PORT -H $SSH_HOST >> ~/.ssh/known_hosts

          # Ensure target exists
          ssh -i ~/.ssh/deploy_key -p $SSH_PORT $SSH_USER@$SSH_HOST \
            "mkdir -p ~/public_html/domains/jabatkopi.my.id"

          # Stream tar directly over SSH — no rsync needed, -T disables PTY so .bashrc is silent
          tar -czf - \
            --exclude='backend/.env' \
            --exclude='backend/node_modules' \
            --exclude='backend/storage/app/public' \
            --exclude='backend/tests' \
            -C backend . | \
          ssh -i ~/.ssh/deploy_key -p $SSH_PORT -T $SSH_USER@$SSH_HOST \
            "tar -xzf - -C ~/public_html/domains/jabatkopi.my.id"

      - name: Run Laravel Optimizations via SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY_PRIVATE }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: 2223
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p $SSH_PORT -H $SSH_HOST >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key -p $SSH_PORT $SSH_USER@$SSH_HOST "
            cd ~/public_html/domains/jabatkopi.my.id
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            echo 'Deploy finished!'
          "
