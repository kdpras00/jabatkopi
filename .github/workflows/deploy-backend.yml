name: 🚀 Deploy Laravel Backend (Rsync via SSH)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, mysql, zip
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Composer Dependencies
        run: |
          cd backend
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Install NPM & Build Assets
        run: |
          cd backend
          npm ci
          npm run build

      - name: Create Deployment Zip
        run: |
          cd backend
          zip -r ../deploy.zip . -x "node_modules/*" "tests/*" "phpunit.xml" ".env" "storage/app/public/*"

      - name: Upload Zip via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY_PRIVATE }}
          port: 2223
          source: "deploy.zip"
          target: "~/public_html/domains/jabatkopi.my.id"

      - name: Extract Zip and Optimize via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY_PRIVATE }}
          port: 2223
          script: |
            TARGET=~/public_html/domains/jabatkopi.my.id
            echo "📦 Finding and moving deploy.zip..."
            find $TARGET -name "deploy.zip" | xargs -I{} mv {} $TARGET/deploy.zip
            
            echo "📦 Extracting backend files..."
            cd $TARGET
            unzip -o deploy.zip
            rm deploy.zip
            
            echo "🚀 Run Laravel optimizations..."
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            echo "✅ Deploy finished!"
