name: 🚀 Deploy Laravel Backend

# Trigger rebuild on cleared disk space
on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, iconv, mysql, zip
          coverage: none

      - name: Install Composer Dependencies
        run: |
          # Validate composer.json is valid only
          cd backend && composer validate --no-check-publish

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install NPM & Build Assets
        run: |
          cd backend
          npm ci
          npm run build

      - name: Deploy via tar+ssh
        env:
          SSH_KEY: ${{ secrets.SSH_KEY_PRIVATE }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: 2223
        run: |
          set -x
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p $SSH_PORT -H $SSH_HOST >> ~/.ssh/known_hosts

          # Ensure target exists
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p $SSH_PORT $SSH_USER@$SSH_HOST \
            "mkdir -p ~/public_html/domains/jabatkopi.my.id"

          # Stream tar directly — exclude vendor, composer install on server instead
          tar -czf - \
            --exclude='./.env' \
            --exclude='./vendor' \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./storage/app/public' \
            --exclude='./tests' \
            -C backend . | \
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p $SSH_PORT -T $SSH_USER@$SSH_HOST \
            "tar -xzf - -C ~/public_html/domains/jabatkopi.my.id"

      - name: Run Laravel Optimizations via SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY_PRIVATE }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: 2223
        run: |
          set -x
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p $SSH_PORT -H $SSH_HOST >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p $SSH_PORT $SSH_USER@$SSH_HOST "
            cd ~/public_html/domains/jabatkopi.my.id
            ~/bin/composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --ignore-platform-req=ext-sodium
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            echo 'Deploy finished!'
          "
